<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">

    <!-- Tailwind Theme -->
    <style type="text/tailwindcss">
        @theme {
            --font-sans: "Inter", sans-serif;
            --font-serif: "Newsreader", serif;
        }
    </style>

    <title>Weather App</title>
</head>

<body class="min-h-screen bg-slate-950 text-white font-sans">

    <main class="max-w-6xl mx-auto px-5 py-8">

        <!-- HEADER -->
        <header class="flex items-center justify-between mb-12">

            <div>
                <h1 class="text-2xl font-bold tracking-wide font-serif">
                    <span class="text-sky-400">☀</span> Weather App
                </h1>

                <p class="text-slate-400 text-sm mt-1">
                    Your weather companion
                </p>
            </div>

            <div class="hidden sm:block text-sm text-slate-400">
                Open-Meteo API
            </div>

        </header>

        <!-- SEARCH -->
        <section class="mb-10">

            <h2 class="text-2xl font-semibold mb-2 font-serif">
                Découvrez la météo
            </h2>

            <p class="text-slate-400 mb-5">
                Recherchez une ville pour connaître sa météo.
            </p>

            <form id="search-form" class="flex flex-col sm:flex-row gap-3">

                <div class="flex-1">
                    <label for="city-input" class="block text-sm mb-2 text-slate-300">
                        Ville
                    </label>

                    <input
                        id="city-input"
                        type="text"
                        placeholder="Entrez le nom d'une ville..."
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-5 py-4 outline-none focus:border-sky-400"
                    >
                </div>

                <button
                    id="search-btn"
                    type="submit"
                    class="bg-sky-500 hover:bg-sky-600 text-white font-semibold px-8 py-4 rounded-xl transition self-end"
                >
                    Rechercher
                </button>

            </form>

            <!-- ERROR MESSAGE -->
            <p
                id="error-message"
                class="text-red-400 text-sm mt-3 hidden"
                role="alert"
            >Veuillez saisir une ville</p>
            
            
            <!-- LOADING -->
            <p
                id="loading"
                class="text-sky-400 text-sm mt-3 hidden"
                role="status"
            >
                Chargement...
            </p>

        </section>

        <!-- CURRENT WEATHER -->
        <section id = "card-principale">

        </section>

        <!-- WEATHER DETAILS -->
        <section id = "details">


        </section>

        <!-- FORECAST -->
        <section class="mb-10">

            <h2 class="text-xl font-semibold mb-5 font-serif">
                Prévisions météo
            </h2>

            <div id="forecast-container">

                <!-- Les cartes météo seront ajoutées avec JavaScript -->

            </div>

        </section>

        <!-- FOOTER -->
        <footer class="border-t border-slate-800 pt-6 text-center">

            <p class="text-sm text-slate-500">
                Weather App · Powered by Open-Meteo
            </p>

        </footer>

    </main>

    <script type="module" src="src/script.js"></script>

</body>
</html>
